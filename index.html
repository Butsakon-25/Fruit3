<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Detector - Street Art AI</title>
    <!-- นำเข้า Google Fonts แนว Street Art / Graffiti -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Kanit:wght@400;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --neon-yellow: #FFE600;
            --neon-pink: #FF007F;
            --neon-cyan: #00F0FF;
            --card-bg: #1E1E1E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 127, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.25) 0%, transparent 40%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px);
            color: #ffffff;
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 4px solid #000000;
            box-shadow: 12px 12px 0px var(--neon-pink), -6px -6px 0px var(--neon-cyan);
            max-width: 500px;
            width: 100%;
            padding: 35px 25px;
            position: relative;
            text-align: center;
            transform: rotate(-1deg);
        }

        .tag-badge {
            position: absolute;
            top: -18px;
            right: -15px;
            background: var(--neon-yellow);
            color: #000;
            font-family: 'Permanent Marker', cursive;
            padding: 5px 15px;
            font-size: 1rem;
            border: 3px solid #000;
            transform: rotate(8deg);
            box-shadow: 4px 4px 0px #000;
        }

        h1 {
            font-family: 'Bungee', 'Kanit', sans-serif;
            font-size: 2.2rem;
            color: var(--neon-yellow);
            text-shadow: 4px 4px 0px #000, -2px -2px 0px var(--neon-pink);
            letter-spacing: 2px;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        p.subtitle {
            color: #cccccc;
            font-size: 0.95rem;
            margin-bottom: 25px;
            font-weight: 400;
        }

        #image-upload {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            background: var(--neon-cyan);
            color: #000000;
            font-family: 'Kanit', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 14px 30px;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s ease;
            margin-bottom: 25px;
        }

        .upload-btn:hover {
            background: var(--neon-yellow);
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px #000000;
        }

        .upload-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px #000000;
        }

        .image-box {
            width: 100%;
            min-height: 240px;
            background: #141414;
            border: 3px dashed #555;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        .image-box.has-image {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px var(--neon-yellow);
        }

        #preview-image {
            max-width: 100%;
            max-height: 280px;
            display: none;
            object-fit: contain;
        }

        .placeholder-text {
            color: #666;
            font-family: 'Permanent Marker', 'Kanit', sans-serif;
            font-size: 1.2rem;
        }

        #status {
            color: var(--neon-yellow);
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        #label-container {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .prediction-item {
            background: #2A2A2A;
            border: 3px solid #000;
            padding: 10px 14px;
            box-shadow: 4px 4px 0px #000;
        }

        .prediction-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 1.05rem;
        }

        .class-name {
            color: #fff;
            text-transform: uppercase;
        }

        .class-prob {
            color: var(--neon-cyan);
        }

        .progress-bg {
            width: 100%;
            height: 14px;
            background: #111;
            border: 2px solid #000;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-yellow));
            width: 0%;
            transition: width 0.4s ease-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tag-badge">AI VISION</div>
        <h1>Fruit Detector</h1>
        <p class="subtitle">อัปโหลดรูปภาพ 1 ภาพเพื่อให้ AI วิเคราะห์ผลลัพธ์</p>

        <!-- ปุ่ม Upload File ภาพ -->
        <label for="image-upload" class="upload-btn">📸 เลือกรูปภาพ (UPLOAD)</label>
        <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)">

        <div id="status">กำลังโหลดโมเดล AI...</div>

        <!-- พื้นที่แสดงรูปภาพ -->
        <div class="image-box" id="image-box">
            <span class="placeholder-text" id="placeholder-text">[ DROP YOUR IMAGE HERE ]</span>
            <img id="preview-image" alt="Uploaded Image" />
        </div>

        <!-- พื้นที่แสดงผลลัพธ์การทำนาย -->
        <div id="label-container"></div>
    </div>

    <!-- Scripts ของ TensorFlow.js และ Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/pfRok_xHd/";

        let model, labelContainer, maxPredictions;

        async function loadModel() {
            const statusEl = document.getElementById("status");
            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                labelContainer = document.getElementById("label-container");
                statusEl.innerText = "✅ โมเดลพร้อมใช้งานแล้ว! กดปุ่ม Upload ด้านบนได้เลย";
                statusEl.style.color = "#00F0FF";
            } catch (error) {
                statusEl.innerText = "❌ เกิดข้อผิดพลาดในการโหลดโมเดล";
                statusEl.style.color = "#FF007F";
                console.error(error);
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById("preview-image");
                const placeholder = document.getElementById("placeholder-text");
                const imageBox = document.getElementById("image-box");

                imgElement.src = e.target.result;
                imgElement.style.display = "block";
                placeholder.style.display = "none";
                imageBox.classList.add("has-image");

                imgElement.onload = async function() {
                    await predict(imgElement);
                };
            };
            reader.readAsDataURL(file);
        }

        async function predict(imageElement) {
            if (!model) {
                alert("กรุณารอสักครู่ โมเดลกำลังโหลด...");
                return;
            }

            const statusEl = document.getElementById("status");
            statusEl.innerText = "⚡ กำลังวิเคราะห์ภาพ...";
            statusEl.style.color = "#FFE600";

            const prediction = await model.predict(imageElement);
            
            prediction.sort((a, b) => b.probability - a.probability);

            labelContainer.innerHTML = "";

            for (let i = 0; i < maxPredictions; i++) {
                const percentage = (prediction[i].probability * 100).toFixed(1);
                
                const itemDiv = document.createElement("div");
                itemDiv.className = "prediction-item";
                itemDiv.innerHTML = `
                    <div class="prediction-header">
                        <span class="class-name">${prediction[i].className}</span>
                        <span class="class-prob">${percentage}%</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${percentage}%;"></div>
                    </div>
                `;
                labelContainer.appendChild(itemDiv);
            }

            statusEl.innerText = "🔥 วิเคราะห์เสร็จสิ้น!";
            statusEl.style.color = "#00F0FF";
        }

        window.addEventListener("DOMContentLoaded", loadModel);
    </script>
</body>
</html>
